name: Publish to Open VSX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build VSIX
        run: npm run package

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'

      - name: Publish to Open VSX
        run: npx ovsx publish *.vsix --pat ${{ secrets.OPENVSX_TOKEN }}
