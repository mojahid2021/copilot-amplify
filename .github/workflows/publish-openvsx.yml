name: Publish to Open VSX

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run compile

      - name: Publish to Open VSX
        run: npx ovsx publish --pat ${{ secrets.OPENVSX_TOKEN }}
